<title>Pichan tayoqchasi VR laboratoriyasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: to‘liq ekranli 3D sahna; ustida ingichka boshqaruv chizig‘i. Ataylab bitta qorong‘i ko‘rinish (asbob paneli). */
:root{
  --bg:#0c1418; --panel:rgba(12,20,24,.86); --line:#2b3a40; --ink:#e4eef0; --muted:#93a7ac; --accent:#7ef0b0; --warn:#e8c25a;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;pointer-events:auto;backdrop-filter:blur(6px);max-width:min(420px,100%)}
.brand b{display:block;font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.acts button{font:inherit;font-weight:700;font-size:.92rem;border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);backdrop-filter:blur(6px)}
.acts button.vr{background:var(--accent);color:#0b1a12;border-color:var(--accent)}
.acts button:hover{filter:brightness(1.1)}
button:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.hint{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:16px;display:flex;justify-content:center;pointer-events:none}
.hint p{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.88rem;color:var(--muted);max-width:720px;text-align:center}
.hint b{color:var(--ink)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#101b20;border:1px solid var(--warn);border-radius:14px;padding:18px 20px;max-width:min(520px,calc(100% - 32px));font-size:.98rem;line-height:1.5;z-index:5;display:flex;flex-direction:column;gap:12px}
.toast button{align-self:flex-end;font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 14px;background:var(--warn);color:#231a05;cursor:pointer}
.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-mono);color:var(--muted);background:var(--bg);z-index:4}
</style>

<div id="app"></div>
<div class="hud">
  <div class="brand"><b>Pichan tayoqchasi · 3D laboratoriya</b><span>Bacillus subtilis · WebXR: VR / AR</span></div>
  <div class="acts">
    <button type="button" class="vr" id="vrBtn">VR shlemda ochish</button>
    <button type="button" id="arBtn">AR rejim</button>
    <button type="button" id="microBtn">Preparat ichiga</button>
  </div>
</div>
<div class="hint"><p id="hint"><b>Sichqoncha / barmoq:</b> aylantirish · <b>g‘ildirak / ikki barmoq:</b> yaqinlashtirish · <b>bosish:</b> yashil strelka ko‘rsatgan jism yoki paneldagi tugma</p></div>
<div class="toast" id="toast" hidden><p id="toastTxt"></p><button type="button" id="toastOk">Tushunarli</button></div>
<div class="fade" id="fade"></div>
<div class="loading" id="loading">3D sahna yuklanmoqda…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
if(!window.THREE){$('#loading').textContent='3D kutubxona yuklanmadi. Internet aloqasini tekshiring.';return}
const T=THREE, V=(x,y,z)=>new T.Vector3(x,y,z), R=Math.random, PI=Math.PI, B=0.9;
const F="'Source Sans 3','Segoe UI',system-ui,sans-serif", FM="'JetBrains Mono',ui-monospace,monospace";
function toast(t){$('#toastTxt').textContent=t;$('#toast').hidden=false}
$('#toastOk').onclick=()=>{$('#toast').hidden=true};

/* ============ RENDERER / SCENE ============ */
const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;
$('#app').appendChild(renderer.domElement);
const scene=new T.Scene();
const BG_LAB=new T.Color(0xd9e1de);scene.background=BG_LAB;
const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,0.01,80);
scene.add(new T.HemisphereLight(0xffffff,0x7d8a90,0.95));
const sun=new T.DirectionalLight(0xffffff,0.7);sun.position.set(1.5,3,2);scene.add(sun);

const std=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.05},o));
const glassMat=()=>new T.MeshPhysicalMaterial({color:0xe8f4ff,transparent:true,opacity:.24,roughness:.05,clearcoat:1,side:T.DoubleSide,depthWrite:false});
const liqMat=(c,op=.72)=>new T.MeshStandardMaterial({color:c,transparent:true,opacity:op,roughness:.25,depthWrite:false});
function rot(o,a,v){o.rotation[a]=v;return o}
function mesh(g,m,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);return o}
function glass(g,x,y,z){const o=mesh(g,glassMat(),x,y,z);o.renderOrder=3;return o}
function liq(g,c,x,y,z,op){const o=mesh(g,liqMat(c,op),x,y,z);o.renderOrder=1;return o}
const lathe=(pts,seg=32)=>new T.LatheGeometry(pts.map(p=>new T.Vector2(p[0],p[1])),seg);
function capsuleGeo(r,L,seg=12){const p=[];for(let i=0;i<=seg;i++){const a=-PI/2+i/seg*PI/2;p.push([Math.max(1e-4,r*Math.cos(a)),-L/2+r*Math.sin(a)])}for(let i=0;i<=seg;i++){const a=i/seg*PI/2;p.push([Math.max(1e-4,r*Math.cos(a)),L/2+r*Math.sin(a)])}const g=lathe(p,20);g.rotateZ(PI/2);return g}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new T.CanvasTexture(c);t.anisotropy=4;return {c,g,t}}
function rrp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function wrap(g,text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){g.fillText(line,x,y);y+=lh}return y}

/* ============ ROOM ============ */
const room=new T.Group();scene.add(room);
{
  const fl=canvasTex(256,256,(g,w)=>{g.fillStyle='#bcc6c3';g.fillRect(0,0,w,w);g.strokeStyle='#aab5b2';g.lineWidth=3;g.strokeRect(0,0,w,w)});
  fl.t.wrapS=fl.t.wrapT=T.RepeatWrapping;fl.t.repeat.set(14,14);
  const floor=mesh(new T.PlaneGeometry(14,14),std(0xffffff,{map:fl.t,roughness:.9}));floor.rotation.x=-PI/2;room.add(floor);
  const wallM=std(0xe8edeb,{roughness:.95});
  room.add(mesh(new T.PlaneGeometry(7,3.2),wallM,0,1.6,-2.4));
  const wl=mesh(new T.PlaneGeometry(6,3.2),wallM,-3.5,1.6,.6);wl.rotation.y=PI/2;room.add(wl);
  const wr=mesh(new T.PlaneGeometry(6,3.2),wallM,3.5,1.6,.6);wr.rotation.y=-PI/2;room.add(wr);
  room.add(mesh(new T.PlaneGeometry(1.5,1.05),new T.MeshBasicMaterial({color:0xcfe8f6}),1.35,1.75,-2.39));
  room.add(mesh(new T.BoxGeometry(1.56,.05,.08),std(0xf4f6f5),1.35,1.2,-2.36));
  const cab=mesh(new T.BoxGeometry(1.3,.9,.5),std(0x5f7670),-1.9,.45,-2.12);room.add(cab);
  [[0x2766c4,.08],[0xc9a24a,.1],[0x6f9a5a,.07],[0x9a4a3a,.09]].forEach((b,i)=>{room.add(mesh(new T.CylinderGeometry(.045,.045,b[1]*2,16),liqMat(b[0],.8),-2.35+i*.28,.9+b[1],-2.1))});
  const poster=canvasTex(600,820,(g,w,h)=>{g.fillStyle='#fbfcfb';g.fillRect(0,0,w,h);g.fillStyle='#1f5fbf';g.fillRect(0,0,w,120);g.fillStyle='#fff';g.font=`800 40px ${F}`;g.fillText('Mikroskop bilan',36,58);g.fillText('ishlash qoidalari',36,102);
    g.fillStyle='#13232a';g.font=`600 27px ${F}`;let y=175;['1. Avval 10× obyektivda qarang.','2. Makrovint bilan tasvirni toping.','3. Mikrovint bilan aniqlang.','4. Yorug‘likni diafragma bilan sozlang.','5. 100× uchun immersion moyi tomizing.','6. Ishdan keyin linzalarni arting.'].forEach(t=>{y=wrap(g,t,36,y,530,40)+16});
    g.fillStyle='#566a70';g.font=`500 20px ${FM}`;g.fillText('B. subtilis: 2–3 × 0,7–0,8 mkm',36,h-40)});
  room.add(mesh(new T.PlaneGeometry(.6,.82),new T.MeshBasicMaterial({map:poster.t}),-.75,1.78,-2.39));
  room.add(rot(mesh(new T.PlaneGeometry(1.6,.5),new T.MeshBasicMaterial({color:0xffffff}),0,3.19,-.6),'x',PI/2));
}

/* ============ LAB (rebuildable) ============ */
let O={}, labG=null;
const DYE={mb:0x2766c4,ink:0x5b4a8f};
function buildLab(){
  if(labG){scene.remove(labG)}
  labG=new T.Group();scene.add(labG);O={};
  // bench
  labG.add(mesh(new T.BoxGeometry(1.72,.04,.74),std(0x34434a,{roughness:.4}),0,B-.02,-.6));
  labG.add(mesh(new T.BoxGeometry(1.66,B-.04,.68),std(0xe2e7e5),0,(B-.04)/2,-.6));
  const add=(k,g)=>{g.userData.key=k;labG.add(g);O[k]=g;return g};

  // jug (suv)
  const jug=add('jug',new T.Group());jug.position.set(-.74,B,-.72);
  jug.add(glass(new T.CylinderGeometry(.032,.032,.11,24,1,true),0,.055,0));jug.add(rot(glass(new T.CircleGeometry(.032,24),0,.001,0),'x',-PI/2));
  const jl=new T.CylinderGeometry(.03,.03,.085,24);jl.translate(0,.0425,0);O.jugLiq=liq(jl,0x9fd0ee,0,.002,0,.6);jug.add(O.jugLiq);

  // hay pile
  const hay=add('hay',new T.Group());hay.position.set(-.74,B,-.46);O.sticks=[];
  for(let i=0;i<9;i++){const s=mesh(new T.CylinderGeometry(.0022,.0022,.04+R()*.025,6),std(0xc99a2e,{roughness:.9}),(R()-.5)*.06,.004+R()*.008,(R()-.5)*.06);s.rotation.set(PI/2+(R()-.5)*.4,0,R()*PI);hay.add(s);O.sticks.push(s)}

  // stand (tripod + gauze)
  const st=new T.Group();st.position.set(-.55,B,-.66);labG.add(st);
  const ring=mesh(new T.TorusGeometry(.065,.004,8,32),std(0x8a969a,{metalness:.7,roughness:.35}),0,.14,0);ring.rotation.x=PI/2;st.add(ring);
  for(let i=0;i<3;i++){const a=i/3*PI*2;const l=mesh(new T.CylinderGeometry(.004,.004,.145,6),std(0x8a969a,{metalness:.7}),Math.cos(a)*.07,.07,Math.sin(a)*.07);st.add(l)}
  st.add(mesh(new T.BoxGeometry(.14,.002,.14),std(0x9aa3a6,{metalness:.5,roughness:.6,transparent:true,opacity:.85}),0,.142,0));

  // flask
  const flask=add('flask',new T.Group());flask.position.set(-.55,B+.143,-.66);
  flask.add(glass(lathe([[1e-4,0],[.062,0],[.066,.006],[.068,.014],[.022,.108],[.02,.115],[.02,.158],[.024,.162],[.024,.166]])));
  O.fLiq=liq(lathe([[1e-4,.003],[.062,.003],[.064,.012],[.04,.06],[1e-4,.06]]),0x9fd0ee,0,0,0,.65);O.fLiq.scale.y=.001;O.fLiq.visible=false;flask.add(O.fLiq);
  O.bubbles=[];for(let i=0;i<14;i++){const b=mesh(new T.SphereGeometry(.0028,8,6),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.75}),(R()-.5)*.07,.006+R()*.04,(R()-.5)*.07);b.visible=false;flask.add(b);O.bubbles.push(b)}
  O.steam=[];for(let i=0;i<6;i++){const s=mesh(new T.SphereGeometry(.014,10,8),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}),0,.17+i*.03,0);flask.add(s);O.steam.push(s)}

  // cotton
  const cot=add('cotton',new T.Group());cot.position.set(-.36,B+.016,-.76);
  cot.add(mesh(new T.IcosahedronGeometry(.02,1),std(0xf7f5ef,{roughness:1,flatShading:true})));

  // spirt lamp
  const lamp=add('lamp',new T.Group());lamp.position.set(-.42,B,-.44);
  lamp.add(glass(new T.CylinderGeometry(.03,.034,.05,24),0,.025,0));
  lamp.add(liq(new T.CylinderGeometry(.027,.031,.03,24),0xbfe6f0,0,.016,0,.45));
  lamp.add(mesh(new T.CylinderGeometry(.011,.011,.012,16),std(0x8a969a,{metalness:.7}),0,.056,0));
  lamp.add(mesh(new T.CylinderGeometry(.0025,.0025,.012,8),std(0xf2efe6),0,.066,0));
  O.flame=new T.Group();O.flame.position.y=.072;
  const fo=mesh(new T.ConeGeometry(.009,.04,16),new T.MeshBasicMaterial({color:0xf2a33a,transparent:true,opacity:.85,depthWrite:false}),0,.02,0);
  const fi=mesh(new T.ConeGeometry(.0045,.018,12),new T.MeshBasicMaterial({color:0x5a9bf0,transparent:true,opacity:.9,depthWrite:false}),0,.009,0);
  O.flame.add(fo,fi);O.flame.scale.setScalar(.001);O.flame.visible=false;lamp.add(O.flame);
  O.fLight=new T.PointLight(0xffa040,0,.6);O.fLight.position.y=.1;lamp.add(O.fLight);

  // funnel stand + funnel + beaker
  const fst=new T.Group();fst.position.set(-.2,B,-.66);labG.add(fst);
  fst.add(mesh(new T.BoxGeometry(.12,.01,.1),std(0x2c3236),-.07,.005,-.02));
  fst.add(mesh(new T.CylinderGeometry(.005,.005,.34,8),std(0x8a969a,{metalness:.7}),-.11,.17,-.04));
  fst.add(rot(mesh(new T.CylinderGeometry(.003,.003,.08,6),std(0x8a969a,{metalness:.7}),-.07,.2,-.02),'z',PI/2));
  const fr=mesh(new T.TorusGeometry(.033,.003,8,24),std(0x8a969a,{metalness:.7}),0,.2,0);fr.rotation.x=PI/2;fst.add(fr);
  const fun=add('funnel',new T.Group());fun.position.set(-.2,B+.12,-.66);
  fun.add(glass(lathe([[.006,0],[.006,.05],[.055,.11],[.058,.112]])));
  fun.add(mesh(lathe([[.004,.056],[.05,.106]]),std(0xfaf8f2,{side:T.DoubleSide,roughness:1})));
  O.funLiq=liq(lathe([[1e-4,.064],[.04,.1],[1e-4,.1]]),0xc9a24a,0,0,0,.8);O.funLiq.visible=false;fun.add(O.funLiq);
  O.drip=mesh(new T.SphereGeometry(.003,8,6),liqMat(0xc9a24a,.9),0,-.005,0);O.drip.visible=false;fun.add(O.drip);
  const bk=add('beaker',new T.Group());bk.position.set(-.2,B,-.66);
  bk.add(glass(new T.CylinderGeometry(.04,.04,.1,28,1,true),0,.05,0));bk.add(rot(glass(new T.CircleGeometry(.04,28),0,.001,0),'x',-PI/2));
  const bl=new T.CylinderGeometry(.037,.037,.07,28);bl.translate(0,.035,0);O.bLiq=liq(bl,0xc9a24a,0,.003,0,.78);O.bLiq.scale.y=.001;O.bLiq.visible=false;bk.add(O.bLiq);
  const film=canvasTex(256,256,(g,w)=>{g.clearRect(0,0,w,w);for(let i=0;i<900;i++){const a=R()*PI*2,r=Math.sqrt(R())*120;g.fillStyle=`rgba(${230+R()*20|0},${226+R()*20|0},${208+R()*20|0},${.35+R()*.5})`;g.beginPath();g.arc(128+Math.cos(a)*r,128+Math.sin(a)*r,3+R()*7,0,PI*2);g.fill()}});
  O.film=mesh(new T.CircleGeometry(.037,32),new T.MeshStandardMaterial({map:film.t,transparent:true,opacity:0,roughness:1,depthWrite:false}),0,.0745,0);O.film.rotation.x=-PI/2;O.film.renderOrder=2;bk.add(O.film);

  // incubator
  const inc=add('incubator',new T.Group());inc.position.set(.1,B,-.74);
  const wm=std(0xe9edeb,{roughness:.5});
  inc.add(mesh(new T.BoxGeometry(.26,.01,.24),wm,0,.005,0),mesh(new T.BoxGeometry(.26,.012,.24),wm,0,.334,0),mesh(new T.BoxGeometry(.01,.34,.24),wm,-.125,.17,0),mesh(new T.BoxGeometry(.01,.34,.24),wm,.125,.17,0),mesh(new T.BoxGeometry(.26,.34,.01),wm,0,.17,-.115));
  inc.add(mesh(new T.BoxGeometry(.26,.05,.012),std(0xd5dbd9),0,.315,.115));
  O.heat=mesh(new T.PlaneGeometry(.2,.02),new T.MeshBasicMaterial({color:0x552211}),0,.27,-.108);inc.add(O.heat);
  O.door=new T.Group();O.door.position.set(-.13,.155,.122);inc.add(O.door);
  const dg=glass(new T.BoxGeometry(.26,.28,.006),.13,0,0);dg.material.opacity=.32;O.door.add(dg);
  O.door.add(mesh(new T.BoxGeometry(.008,.08,.012),std(0x8a969a,{metalness:.7}),.24,0,.012));
  O.disp=canvasTex(320,64,()=>{});O.dispM=mesh(new T.PlaneGeometry(.2,.04),new T.MeshBasicMaterial({map:O.disp.t}),0,.315,.122);inc.add(O.dispM);
  O.incLight=new T.PointLight(0xffb070,0,.4);O.incLight.position.set(0,.2,0);inc.add(O.incLight);

  // pipette + rack
  labG.add(mesh(new T.BoxGeometry(.04,.025,.03),std(0x2c3236),.32,B+.0125,-.42));
  const pip=add('pipette',new T.Group());pip.position.set(.32,B+.006,-.42);
  pip.add(glass(new T.CylinderGeometry(.0035,.0025,.13,12),0,.065,0));
  const bulb=mesh(new T.SphereGeometry(.008,14,10),std(0x7a2a22,{roughness:.6}),0,.14,0);bulb.scale.y=1.5;pip.add(bulb);
  O.sample=mesh(new T.CylinderGeometry(.0022,.002,.016,8),std(0xe9e6da),0,.012,0);O.sample.visible=false;pip.add(O.sample);

  // slide + drop
  const sl=add('slide',new T.Group());sl.position.set(.42,B,-.52);
  const sg=glass(new T.BoxGeometry(.076,.0012,.026),0,.0006,0);sg.material.opacity=.5;sl.add(sg);
  sl.add(mesh(new T.BoxGeometry(.02,.0013,.026),std(0xf2f4f3,{transparent:true,opacity:.85}),-.028,.0007,0));
  O.drop=mesh(new T.SphereGeometry(.006,18,10),liqMat(0xd8e6dc,.85),0,.0013,0);O.drop.scale.set(1,.45,1);O.drop.visible=false;sl.add(O.drop);
  // coverslip
  const cv=add('cover',new T.Group());cv.position.set(.5,B,-.42);
  const cg=glass(new T.BoxGeometry(.022,.0007,.022),0,.0004,0);cg.material.opacity=.45;cv.add(cg);
  // dye bottle
  const dy=add('dye',new T.Group());dy.position.set(.54,B,-.6);
  O.dyeBody=mesh(new T.CylinderGeometry(.016,.017,.055,20),liqMat(DYE.mb,.85),0,.0275,0);dy.add(O.dyeBody);
  dy.add(mesh(new T.CylinderGeometry(.007,.009,.02,12),std(0x1b1f22),0,.065,0));
  const db=mesh(new T.SphereGeometry(.008,12,10),std(0x2a2a2a,{roughness:.7}),0,.083,0);db.scale.y=1.3;dy.add(db);
  O.dyeLbl=canvasTex(128,48,()=>{});const lb=mesh(new T.CylinderGeometry(.0172,.0172,.022,20,1,true,-PI/2,PI),new T.MeshBasicMaterial({map:O.dyeLbl.t,side:T.DoubleSide}),0,.028,0);dy.add(lb);
  O.dyeDrop=mesh(new T.SphereGeometry(.0028,10,8),liqMat(DYE.mb,.95),0,0,0);O.dyeDrop.visible=false;labG.add(O.dyeDrop);

  // microscope
  const mic=add('mic',new T.Group());mic.position.set(.66,B,-.72);mic.rotation.y=Math.atan2(-.66,.72);
  const mb=std(0xe8ebec,{roughness:.35}),md=std(0x23292d,{roughness:.4,metalness:.3}),ms=std(0xb8c0c4,{metalness:.85,roughness:.25});
  mic.add(mesh(new T.BoxGeometry(.12,.022,.16),mb,0,.011,0));
  mic.add(mesh(new T.BoxGeometry(.034,.2,.036),mb,0,.12,-.06));
  mic.add(mesh(new T.BoxGeometry(.034,.05,.08),mb,0,.24,-.035));
  const tube=mesh(new T.CylinderGeometry(.014,.014,.14,20),mb,0,.25,.03);tube.rotation.x=.4;mic.add(tube);

const tws=[];const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

function runTw(dt){for(let i=tws.length-1;i>=0;i--){const w=tws[i];w.t+=dt;const p=Math.min(1,w.t/w.d);w.fn(ease(p),p);if(p>=1){tws.splice(i,1);w.res()}}}

  if(p){const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)orb.r=Math.min(orb.rmax,Math.max(orb.rmin,orb.r*pinch/d));pinch=d}

    if(mode==='immersive-ar'){scene.background=null;room.visible=false;dome.visible=false;scene.fog=null}

}

renderer.setAnimationLoop(()=>{
  const dt=Math.min(.05,clock.getDelta());time+=dt;runTw(dt);applyOrbit();
  if(S.mode==='lab'&&labG){
    if(O.flame.visible)O.flame.scale.set(1+Math.sin(time*40)*.05,1+Math.sin(time*31)*.08,1);
    if(boilT>=0){O.bubbles.forEach(b=>{b.position.y+=dt*.09;if(b.position.y>.052*O.fLiq.scale.y/.85+.01)b.position.y=.006});
      O.steam.forEach((s,i)=>{const k=((time*.4+i/6)%1);s.position.set(Math.sin(time+i)*.01,.18+k*.14,0);s.material.opacity=.3*(1-k);s.scale.setScalar(.6+k)});
      if(time-lastPanel>.25){lastPanel=time;drawPanel()}}
    const a=ACTS[S.ai],tgt=O[a.k[0]];O.arrow.visible=!S.busy&&!!tgt&&!S.info;
    if(O.arrow.visible){bb.setFromObject(tgt);O.arrow.position.set((bb.min.x+bb.max.x)/2,bb.max.y+.05+Math.sin(time*4)*.012,(bb.min.z+bb.max.z)/2)}
  } else if(S.mode==='micro'){stepSwarm(dt);body.rotation.x+=dt*.35;sporeG.rotation.x=body.rotation.x;stepFlags(time)}
  if(renderer.xr.isPresenting){let hid=null;for(const c of ctrls){const h=ctrlHit(c);c.userData.line.scale.z=h?h.distance:2;c.userData.dot.visible=!!h;if(h){c.userData.dot.position.copy(h.point);const b=panelBtn(h);if(b)hid=b.id}}setHover(hid)}
  renderer.render(scene,camera);
});

buildLab();placePanel();setOrbit('lab');applyHero();drawPanel();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawPanel();drawDisp();drawDyeLbl()});
$('#loading').hidden=true;
if(navigator.xr&&navigator.xr.isSessionSupported){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok)$('#vrBtn').textContent='VR ga kirish'}).catch(()=>{})}
})();
